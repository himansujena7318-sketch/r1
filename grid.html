<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
       :root{
           --clr-dark: #0f172a;
           --clr-light: #f1f5f9;
           --clr-accent: #e11d48;
       }


       *{
           box-sizing: border-box;
       }


       body{
           margin: 60px 0 0 0;
           padding: 0;
           line-height: 1.6;
           word-spacing: 1.4px;
           font-family: 'Roboto', sans-serif;
           color: var(--clr-dark);
           background-color: var(--clr-light);
       }


       .container{
           width: 80%;
           margin: 0 auto;
           border: 10px solid var(--clr-accent);
           display: grid;
           grid-template-columns: 1fr 1fr 1fr;
           grid-template-rows: 100px 100px 100px 200px;
       }


       .item{
           padding: 8px;
           background-color: var(--clr-dark);
           font-weight: 700;
           color: var(--clr-light);
           border: 10px solid var(--clr-accent)
       }


       .item-1{
           background-color: aquamarine;
           /* grid-row-start: -2;
           grid-row-end: -1;
           grid-column-start: -3;
           grid-column-end: -1; */
           /* grid-row: -2/-1;
           grid-column: -3/-1; */
           /* grid-area: -2/-3/-1/-1;  row-start column-start row-end column-end
            */
           grid-area: 2/1/4/3;
       }
       .item-2{
           background-color: blueviolet;
           grid-row-start: 1;
           grid-row-end: -1;
           grid-column-start: 2;
           grid-column-end: 3;
       }
       .item-4{
            grid-area: 2/2/3/3;
            z-index: 2;
       }
       .item-5{
           grid-area: 3/1/4/2;
           z-index: 2;
       }




   </style>
</head>
<body>
   <div class="container">
       <div class="item item-1">1</div>
       <div class="item item-2">2</div>
       <div class="item item-4">4</div>
       <div class="item item-5">5</div>
       <div class="item item-3">3</div>
       <div class="item item-3">3</div>
       <div class="item item-3">3</div>
   </div>
</body>
</html>
